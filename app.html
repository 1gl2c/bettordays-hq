<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BettorDays App</title>
<meta name="description" content="Post your tickets, follow friends, build parlays together. Free. 21+.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@700;900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#0b0d0c;--p:#111513;--p2:#0f1311;--line:#1f2724;--tx:#eef3f0;--mu:#8a9a93;--dim:#5b6b64;--acc:#04ff9f;--bad:#ff4d5e;--warn:#ffb020}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Geist,system-ui,sans-serif}
body{background-image:linear-gradient(rgba(4,255,159,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(4,255,159,.035) 1px,transparent 1px);background-size:44px 44px;min-height:100vh}
a{color:var(--acc)}
.acc{color:var(--acc)}
button{font:inherit}
.top{position:sticky;flex-wrap:nowrap;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 16px;background:rgba(11,13,12,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.logo{font:900 22px Kanit,sans-serif;text-transform:uppercase;color:var(--tx);text-decoration:none;letter-spacing:.01em}
.logo span{color:var(--acc)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}nav::-webkit-scrollbar{display:none}nav a{white-space:nowrap}
nav a{font:700 11px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:8px 10px;border:1px solid transparent}
nav a.on{color:var(--acc);border-color:var(--line)}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font:900 clamp(30px,6vw,46px)/1 Kanit,sans-serif;text-transform:uppercase;margin:6px 0 6px}
h1 span{color:var(--acc)}
h2{font:900 22px Kanit,sans-serif;text-transform:uppercase;margin:22px 0 10px}
.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.lbl{font:500 11px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.card{background:rgba(17,21,19,.94);border:1px solid var(--line);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{background:none;border:1px solid var(--line);color:var(--tx);padding:9px 12px;font:700 11px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc)}
.btn.go{background:var(--acc);color:#0b0d0c;border-color:var(--acc)}
.btn.sm{padding:6px 9px;font-size:10px}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.bad{color:var(--bad)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:10px 11px;font:15px Geist,sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label.f{display:block;margin:10px 0 5px}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:#16201c;border:1px solid var(--line);display:grid;place-items:center;font:900 15px Kanit,sans-serif;color:var(--acc);flex:none}
.un{font-weight:600;color:var(--tx);text-decoration:none}
.meta{font:12px 'Geist Mono',monospace;color:var(--dim)}
.legs{margin:12px 0 8px;padding:0;list-style:none}
.legs li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.legs li b{font:700 13px 'Geist Mono',monospace;color:var(--acc)}
.nums{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.nums div b{display:block;font:900 22px Kanit,sans-serif}
.badge{font:700 10px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--line);color:var(--mu)}
.badge.won{color:#0b0d0c;background:var(--acc);border-color:var(--acc)}
.badge.lost{color:var(--bad);border-color:var(--bad)}
.badge.cashed_out{color:var(--warn);border-color:var(--warn)}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.empty{color:var(--mu);text-align:center;padding:30px 10px;border:1px dashed var(--line)}
.msg{min-height:18px;font-size:13px;margin-top:8px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg);border:1px solid var(--line)}
.bub{max-width:85%;padding:8px 11px;background:#16201c;border:1px solid var(--line);font-size:14px;line-height:1.4;word-wrap:break-word}
.bub.me{align-self:flex-end;border-color:rgba(4,255,159,.4)}
.bub small{display:block;font:11px 'Geist Mono',monospace;color:var(--dim);margin-bottom:3px}
.boardpick{max-height:260px;overflow-y:auto;border:1px solid var(--line)}
.boardpick button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);padding:9px 11px;cursor:pointer;font-size:14px}
.boardpick button:hover{background:#121a17}
.boardpick b{font:700 12px 'Geist Mono',monospace;color:var(--acc)}
.banner{border:1px solid var(--acc);background:rgba(4,255,159,.07);padding:14px 16px;margin-bottom:16px}
.foot{color:var(--dim);font:11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-top:30px}
@media (max-width:640px){.two{grid-template-columns:1fr}.top{gap:8px;padding:10px 12px}nav{gap:0}nav a{padding:7px 5px;font-size:10px;letter-spacing:.06em}.logo{font-size:16px}}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/">Bettor<span>Days</span></a>
  <nav id="nav" aria-label="App">
    <a href="/" data-r="hq">Board</a><a href="#/feed" data-r="feed">Feed</a><a href="#/post" data-r="post">Post</a><a href="#/rooms" data-r="rooms">Rooms</a><a href="#/leaders" data-r="leaders">Leaders</a><a href="#/people" data-r="people">People</a><a href="#/me" data-r="me">Me</a>
  </nav>
  <button class="btn" id="bell" type="button" aria-label="Ring the bell for picks" title="Ring the bell" style="padding:6px 9px;font-size:16px">🛎️</button>
</div>
<main id="view" aria-live="polite"><p class="sub">Loading...</p></main>
<div class="foot">bettordays.xyz · 21+ · Bet responsibly · 1-800-GAMBLER</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/sb.js"></script>
<script>
const sb = window.BD_SB;
const V = document.getElementById('view');
let ME = null, MYP = null, MYS = null, FOLLOWING = new Set(), FOLLOWERS = new Set(), BOARD = [], chan = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => n == null ? '' : '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const ago = t => { const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? 'now' : s < 3600 ? Math.floor(s/60) + 'm' : s < 86400 ? Math.floor(s/3600) + 'h' : Math.floor(s/86400) + 'd'; };
const isFriend = id => FOLLOWING.has(id) && FOLLOWERS.has(id);
const VIS = {public: 'Everyone', friends: 'Friends only', private: 'Only me'};
const safeUrl = u => /^https:\/\/(www\.)?kalshi\.com\//.test(u || '') ? u : null;

async function loadMe() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  ME = session.user;
  const [p, s, f1, f2] = await Promise.all([
    sb.from('profiles').select('*').eq('id', ME.id).maybeSingle(),
    sb.from('settings').select('*').eq('id', ME.id).maybeSingle(),
    sb.from('follows').select('followee').eq('follower', ME.id),
    sb.from('follows').select('follower').eq('followee', ME.id)
  ]);
  MYP = p.data; MYS = s.data;
  FOLLOWING = new Set((f1.data || []).map(x => x.followee));
  FOLLOWERS = new Set((f2.data || []).map(x => x.follower));
  return true;
}
async function loadBoard() { try { const r = await fetch('/board.json', {cache: 'no-store'}); if (r.ok) BOARD = await r.json(); } catch (e) {} }

function pickCard(p) {
  const u = p.profiles || {};
  const mine = ME && p.user_id === ME.id;
  const legs = Array.isArray(p.legs) ? p.legs : [];
  const tail = safeUrl(p.tail_url) || safeUrl(u.kalshi_link);
  const hit = legs.length && legs.every(l => l.pct) ? Math.round(legs.reduce((a, l) => a * l.pct / 100, 1) * 100) : null;
  return `<article class="card" data-id="${p.id}">
    <div class="row"><div class="who"><div class="av">${esc((u.username || '?')[0].toUpperCase())}</div><div><a class="un" href="#/u/${esc(u.username)}">${esc(u.display_name || u.username)}</a> <span class="meta">@${esc(u.username)} · ${ago(p.created_at)}</span></div></div><span class="sp"></span>
    <span class="badge ${esc(p.status)}">${esc(p.status.replace('_', ' '))}</span>${p.source === 'kalshi' ? '<span class="badge">Kalshi sync</span>' : ''}</div>
    ${p.title ? `<h2 style="margin:12px 0 0;font-size:20px">${esc(p.title)}</h2>` : ''}
    <ul class="legs">${legs.map(l => `<li><span>${esc(l.text)}</span>${l.pct ? `<b>${esc(l.pct)}%</b>` : ''}</li>`).join('')}</ul>
    <div class="nums">${p.stake != null ? `<div><span class="lbl">Stake</span><b>${money(p.stake)}</b></div>` : ''}${p.multiplier ? `<div><span class="lbl">Odds</span><b>${esc(p.multiplier)}x</b></div>` : ''}${p.payout != null ? `<div><span class="lbl">Pays</span><b style="color:var(--acc)">${money(p.payout)}</b></div>` : ''}${hit != null ? `<div><span class="lbl">Model hit %</span><b>${hit}%</b></div>` : ''}</div>
    ${p.note ? `<p class="sub" style="margin:6px 0">${esc(p.note)}</p>` : ''}
    <div class="row rx" style="margin-top:10px;gap:6px"></div>
    <div class="row" style="margin-top:8px">${tail ? `<a class="btn go sm" href="${esc(tail)}" target="_blank" rel="noopener">Tail on Kalshi</a>` : ''}
      <span class="meta">${esc(VIS[p.visibility])}</span><span class="sp"></span>
      ${mine ? `<select class="stSel" aria-label="Ticket result" style="width:auto;padding:6px"> ${['open','won','lost','cashed_out','void'].map(s => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${s.replace('_',' ')}</option>`).join('')}</select><button class="btn sm bad delPick" type="button">Delete</button>` : ''}
    </div></article>`;
}
function wirePicks(root) {
  root.querySelectorAll('.stSel').forEach(s => s.onchange = async () => { const id = s.closest('article').dataset.id; await sb.from('picks').update({status: s.value}).eq('id', id); route(); });
  root.querySelectorAll('.delPick').forEach(b => b.onclick = async () => { if (!confirm('Delete this ticket?')) return; await sb.from('picks').delete().eq('id', b.closest('article').dataset.id); route(); });
}
const PSEL = '*, profiles(username, display_name, kalshi_link)';

async function vFeed(mode) {
  mode = mode || 'everyone';
  V.innerHTML = `${location.hash.includes('welcome') ? `<div class="banner"><b>Welcome to the family, @${esc(MYP.username)}.</b> Follow your friends, post your tickets, and start a room to build parlays together. We still don't want your data. We want your W's.</div>` : ''}
    <div id="mc"></div><h1>The <span>feed</span></h1><p class="sub">Tickets from the BettorDays family. Friends are people who follow you back.</p>
    <div class="tabs"><button class="btn ${mode === 'everyone' ? 'on' : ''}" data-m="everyone" type="button">Everyone</button><button class="btn ${mode === 'friends' ? 'on' : ''}" data-m="friends" type="button">Following</button><a class="btn go" href="#/post">+ Post a ticket</a></div><div id="list"><p class="sub">Loading...</p></div>`;
  V.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) vFeed(b.dataset.m); };
  modelCard().then(h => { const m = V.querySelector('#mc'); if (m) m.innerHTML = h; });
  let q = sb.from('picks').select(PSEL).order('created_at', {ascending: false}).limit(60);
  if (mode === 'friends') q = q.in('user_id', [...FOLLOWING, ME.id]);
  const { data, error } = await q;
  const L = V.querySelector('#list');
  if (error) { L.innerHTML = `<p class="msg bad">${esc(error.message)}</p>`; return; }
  L.innerHTML = data.length ? data.map(pickCard).join('') : `<div class="empty">Nothing here yet. ${mode === 'friends' ? 'Follow some people from the People tab.' : 'Be the first to post a ticket.'}</div>`;
  wirePicks(L); loadReactions(L);
}

function legBuilder(target, legs, onChange) {
  const draw = () => {
    target.querySelector('.cur').innerHTML = legs.length ? legs.map((l, i) => `<li><span>${esc(l.text)}</span><span>${l.pct ? `<b>${l.pct}%</b> ` : ''}<button class="btn sm bad" data-i="${i}" type="button" aria-label="Remove leg">x</button></span></li>`).join('') : '<li><span class="meta">No legs yet. Tap legs from the board or type your own.</span></li>';
    onChange && onChange();
  };
  target.innerHTML = `<ul class="legs cur"></ul>
    <div class="row" style="margin:8px 0"><input class="custom" placeholder="Type a leg, e.g. Lakers ML" maxlength="80" style="flex:1;min-width:180px"><button class="btn addc" type="button">Add leg</button></div>
    <p class="lbl" style="margin:10px 0 6px">From the latest graded board</p>
    <input class="flt" placeholder="Search the board" style="margin-bottom:6px"><div class="boardpick"></div>`;
  const bp = target.querySelector('.boardpick');
  const drawBoard = () => { const f = target.querySelector('.flt').value.toLowerCase(); bp.innerHTML = BOARD.filter(b => !f || b.text.toLowerCase().includes(f)).slice(0, 80).map(b => `<button type="button" data-t="${esc(b.text)}" data-p="${b.pct}"><span>${esc(b.text)} <span class="meta">${esc(b.game || '')}</span></span><b>${b.pct}%</b></button>`).join('') || '<p class="meta" style="padding:10px">No board loaded.</p>'; };
  target.querySelector('.flt').oninput = drawBoard;
  bp.onclick = e => { const b = e.target.closest('button'); if (!b || legs.length >= 25) return; legs.push({text: b.dataset.t, pct: +b.dataset.p}); draw(); };
  target.querySelector('.addc').onclick = () => { const i = target.querySelector('.custom'); const t = i.value.trim(); if (t && legs.length < 25) { legs.push({text: t.slice(0, 80)}); i.value = ''; draw(); } };
  target.querySelector('.cur').onclick = e => { const b = e.target.closest('button[data-i]'); if (b) { legs.splice(+b.dataset.i, 1); draw(); } };
  drawBoard(); draw();
}

function vPost(prefill) {
  const legs = prefill ? prefill.slice() : [];
  V.innerHTML = `<h1>Post a <span>ticket</span></h1><p class="sub">Your ticket shows on your profile and the feed. You choose who sees it.</p>
  <form class="card" id="pf" novalidate>
    <label class="f lbl" for="pt">Ticket name (optional)</label><input id="pt" maxlength="80" placeholder="Tuesday hammer">
    <p class="lbl" style="margin:14px 0 0">Legs</p><div id="lb"></div>
    <div class="two"><div><label class="f lbl" for="ps">Stake ($)</label><input id="ps" type="number" min="0" step="0.01" inputmode="decimal"></div><div><label class="f lbl" for="pm">Odds (x)</label><input id="pm" type="number" min="1" step="0.01" inputmode="decimal" placeholder="2.16"></div></div>
    <p class="meta" id="pay" style="margin-top:6px"></p>
    <label class="f lbl" for="pu">Kalshi link for this ticket (optional, so people can tail)</label><input id="pu" type="url" placeholder="https://kalshi.com/...">
    <label class="f lbl" for="pn">Note (optional)</label><textarea id="pn" maxlength="280" rows="2"></textarea>
    <label class="f lbl" for="pv">Who can see it</label><select id="pv"><option value="public">Everyone</option><option value="friends">Friends only (people who follow you back)</option><option value="private">Only me</option></select>
    <button class="btn go" type="submit" style="margin-top:14px;width:100%;padding:14px">Post ticket</button><div class="msg" id="pmsg"></div>
  </form>`;
  V.querySelector('#pv').value = (MYS && MYS.default_visibility) || 'public';
  const upd = () => { const s = +V.querySelector('#ps').value, m = +V.querySelector('#pm').value; const hit = legs.length && legs.every(l => l.pct) ? Math.round(legs.reduce((a, l) => a * l.pct / 100, 1) * 100) : null; V.querySelector('#pay').textContent = [s && m ? `Pays ${money(s * m)}` : '', hit != null ? `Model hit chance about ${hit}% (raw grades multiplied)` : ''].filter(Boolean).join(' · '); };
  legBuilder(V.querySelector('#lb'), legs, upd);
  V.querySelector('#ps').oninput = upd; V.querySelector('#pm').oninput = upd;
  V.querySelector('#pf').onsubmit = async e => {
    e.preventDefault(); const M = V.querySelector('#pmsg');
    if (!legs.length) { M.className = 'msg bad'; M.textContent = 'Add at least one leg.'; return; }
    const url = V.querySelector('#pu').value.trim();
    if (url && !safeUrl(url)) { M.className = 'msg bad'; M.textContent = 'Tail links have to be kalshi.com links.'; return; }
    const s = V.querySelector('#ps').value, m = V.querySelector('#pm').value;
    const row = {user_id: ME.id, title: V.querySelector('#pt').value.trim() || null, legs, stake: s ? +s : null, multiplier: m ? +m : null, payout: s && m ? Math.round(s * m * 100) / 100 : null, tail_url: url || null, note: V.querySelector('#pn').value.trim() || null, visibility: V.querySelector('#pv').value};
    const { error } = await sb.from('picks').insert(row);
    if (error) { M.className = 'msg bad'; M.textContent = error.message; return; }
    location.hash = '#/u/' + MYP.username;
  };
}

async function vPeople() {
  V.innerHTML = `<h1>Find your <span>people</span></h1><p class="sub">Follow anyone. When they follow you back, you're friends: you see each other's friends-only tickets and can build parlays together in rooms.</p>
  <input id="q" placeholder="Search usernames" aria-label="Search usernames"><div id="pl" style="margin-top:12px"></div>`;
  const draw = async () => {
    const q = V.querySelector('#q').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
    let r = sb.from('profiles').select('id, username, display_name, bio').neq('id', ME.id).order('created_at', {ascending: false}).limit(40);
    if (q) r = r.ilike('username', q + '%');
    const { data } = await r;
    V.querySelector('#pl').innerHTML = (data || []).map(p => `<div class="card row"><div class="who"><div class="av">${esc(p.username[0].toUpperCase())}</div><div><a class="un" href="#/u/${esc(p.username)}">${esc(p.display_name || p.username)}</a> <span class="meta">@${esc(p.username)}${isFriend(p.id) ? ' · friend' : FOLLOWERS.has(p.id) ? ' · follows you' : ''}</span>${p.bio ? `<div class="meta" style="margin-top:3px">${esc(p.bio)}</div>` : ''}</div></div><span class="sp"></span>${followBtn(p.id)}</div>`).join('') || '<div class="empty">No one found.</div>';
    wireFollow(V);
  };
  let t; V.querySelector('#q').oninput = () => { clearTimeout(t); t = setTimeout(draw, 250); }; draw();
}
const followBtn = id => FOLLOWING.has(id) ? `<button class="btn sm on fol" data-id="${id}" data-f="1" type="button">Following</button>` : `<button class="btn sm go fol" data-id="${id}" type="button">${FOLLOWERS.has(id) ? 'Follow back' : 'Follow'}</button>`;
function wireFollow(root) {
  root.querySelectorAll('.fol').forEach(b => b.onclick = async () => {
    const id = b.dataset.id;
    if (b.dataset.f) { await sb.from('follows').delete().eq('follower', ME.id).eq('followee', id); FOLLOWING.delete(id); }
    else { await sb.from('follows').insert({follower: ME.id, followee: id}); FOLLOWING.add(id); }
    b.outerHTML = followBtn(id); wireFollow(root);
  });
}

async function vUser(name) {
  const { data: p } = await sb.from('profiles').select('*').eq('username', name).maybeSingle();
  if (!p) { V.innerHTML = '<div class="empty">No user with that name.</div>'; return; }
  const [{ count: fr }, { count: fg }, { data: picks }] = await Promise.all([
    sb.from('follows').select('*', {count: 'exact', head: true}).eq('followee', p.id),
    sb.from('follows').select('*', {count: 'exact', head: true}).eq('follower', p.id),
    sb.from('picks').select(PSEL).eq('user_id', p.id).order('created_at', {ascending: false}).limit(60)
  ]);
  const W = picks.filter(x => x.status === 'won').length, Lo = picks.filter(x => x.status === 'lost').length;
  const mine = p.id === ME.id;
  V.innerHTML = `<div class="card"><div class="row"><div class="av" style="width:56px;height:56px;font-size:24px">${esc(p.username[0].toUpperCase())}</div><div><h1 style="margin:0;font-size:30px">${esc(p.display_name || p.username)}</h1><span class="meta">@${esc(p.username)}${!mine && isFriend(p.id) ? ' · friends' : ''}</span></div><span class="sp"></span>${mine ? '<a class="btn" href="#/me">Edit profile</a>' : followBtn(p.id)}</div>
    ${p.bio ? `<p class="sub" style="margin:12px 0 0">${esc(p.bio)}</p>` : ''}
    <div class="nums" style="margin-top:12px"><div><span class="lbl">Followers</span><b>${fr || 0}</b></div><div><span class="lbl">Following</span><b>${fg || 0}</b></div><div><span class="lbl">Record</span><b>${W}-${Lo}</b></div></div>
    ${safeUrl(p.kalshi_link) ? `<a class="btn go" href="${esc(p.kalshi_link)}" target="_blank" rel="noopener">Tail ${esc(p.username)} on Kalshi</a>` : ''}</div>
    <h2>Tickets</h2><div id="ul">${picks.length ? picks.map(pickCard).join('') : `<div class="empty">${mine ? 'You haven\'t posted a ticket yet. <a href="#/post">Post one</a>.' : 'No tickets you can see yet. Some may be friends-only.'}</div>`}</div>`;

async function drawKalshi() {
  const box = V.querySelector('#kal'); if (!box) return;
  const { data } = await sb.rpc('kalshi_status');
  const on = data && data[0];
  const tok = async () => (await sb.auth.getSession()).data.session.access_token;
  if (on) {
    box.innerHTML = `<h2 style="margin-top:0">Kalshi <span style="color:var(--acc)">connected</span></h2><p class="sub">${on.last_sync ? 'Last synced ' + ago(on.last_sync) + ' ago.' : 'Not synced yet.'} Sync pulls your open Kalshi positions and settled results into your tickets.</p>
      <div class="row"><button class="btn go" id="ks" type="button">Sync now</button><button class="btn bad" id="kd" type="button">Disconnect</button></div><div class="msg" id="kmsg"></div>`;
    box.querySelector('#ks').onclick = async () => { const M = box.querySelector('#kmsg'), b = box.querySelector('#ks'); b.disabled = true; M.className = 'msg'; M.textContent = 'Syncing...'; const r = await fetch('/api/kalshi-sync', {method: 'POST', headers: {Authorization: 'Bearer ' + await tok()}}); const j = await r.json().catch(() => ({})); b.disabled = false; M.className = 'msg ' + (r.ok ? 'ok' : 'bad'); M.textContent = r.ok ? `Synced: ${j.added} new, ${j.updated} updated.` : (j.error || 'Sync failed.'); };
    box.querySelector('#kd').onclick = async () => { if (!confirm('Remove your Kalshi key from BettorDays?')) return; await fetch('/api/kalshi-key', {method: 'DELETE', headers: {Authorization: 'Bearer ' + await tok()}}); drawKalshi(); };
    return;
  }
  box.innerHTML = `<h2 style="margin-top:0">Connect Kalshi</h2>
    <p class="sub">Sync your real Kalshi tickets to your profile. On Kalshi: Account &amp; security, API keys, Create key. Kalshi shows a Key ID and downloads a private key file. Paste both here.</p>
    <ul class="sub" style="padding-left:18px;line-height:1.6;margin-top:0"><li>Your private key is encrypted before it's saved. Nobody can read it back out, including us, and it never shows on the site.</li><li>We only read your positions and results. We never place trades.</li><li>If Kalshi lets you make a read-only key, use that. You can delete the key on Kalshi or disconnect here anytime.</li></ul>
    <form id="kf" novalidate><label class="f lbl" for="kid">Key ID</label><input id="kid" autocomplete="off" spellcheck="false" maxlength="100">
    <label class="f lbl" for="kpk">Private key (open the downloaded file and paste everything)</label><textarea id="kpk" rows="5" autocomplete="off" spellcheck="false" placeholder="-----BEGIN RSA PRIVATE KEY-----"></textarea>
    <button class="btn go" type="submit" style="margin-top:10px">Connect Kalshi</button><div class="msg" id="kfm"></div></form>`;
  box.querySelector('#kf').onsubmit = async e => {
    e.preventDefault(); const M = box.querySelector('#kfm'), b = box.querySelector('#kf button'); b.disabled = true; M.className = 'msg'; M.textContent = 'Checking with Kalshi...';
    const r = await fetch('/api/kalshi-key', {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + await tok()}, body: JSON.stringify({key_id: box.querySelector('#kid').value, private_key: box.querySelector('#kpk').value})});
    const j = await r.json().catch(() => ({})); b.disabled = false;
    if (!r.ok) { M.className = 'msg bad'; M.textContent = j.error || 'Could not connect.'; return; }
    box.querySelector('#kpk').value = ''; drawKalshi();
  };
}

async function vRoom(id) {
  const { data: room } = await sb.from('rooms').select('*, profiles!rooms_owner_fkey(username)').eq('id', id).maybeSingle();
  if (!room) { V.innerHTML = '<div class="empty">Room not found.</div>'; return; }
  const names = {};
  let members = [];
  const loadMembers = async () => { const { data } = await sb.from('room_members').select('user_id, profiles(username)').eq('room_id', id); members = data || []; members.forEach(x => names[x.user_id] = x.profiles?.username); return members; };
  await loadMembers();
  let joined = members.some(m => m.user_id === ME.id);
  V.innerHTML = `<div class="row"><h1 style="margin:0">${esc(room.name)}</h1><span class="sp"></span><a class="btn sm" href="#/rooms">All rooms</a></div>
  <p class="sub" style="margin:6px 0 12px"><span id="onl" class="acc">● 1 online</span> · <span id="memc">${members.length} in the room</span>${room.pinned ? ' · pinned' : ' · started by @' + esc(room.profiles?.username || '')}</p>
  <div class="row" id="joinRow" style="margin-bottom:12px">${joined ? '' : '<button class="btn go" id="join" type="button">Join the room</button><span class="meta">Anyone can read. Join to talk and add legs.</span>'}${!room.pinned && room.owner === ME.id ? '<span class="sp"></span><button class="btn sm bad" id="delr" type="button">Delete room</button>' : ''}${joined && room.owner !== ME.id && !room.pinned ? '<span class="sp"></span><button class="btn sm bad" id="leave" type="button">Leave</button>' : ''}</div>
  <div class="two"><div><p class="lbl" style="margin:0 0 6px">Chat</p><div class="chat" id="chat"></div><form class="row" id="cf" style="margin-top:6px"><input id="ci" maxlength="500" placeholder="${joined ? 'Talk your talk' : 'Join to chat'}" style="flex:1" aria-label="Message" ${joined ? '' : 'disabled'}><button class="btn go" type="submit" ${joined ? '' : 'disabled'}>Send</button></form><div class="msg" id="cm"></div></div>
  <div><p class="lbl" style="margin:0 0 6px">Shared legs</p><div class="card" style="padding:10px"><ul class="legs" id="rl" style="margin:0"></ul><p class="meta" id="rh"></p><button class="btn go" id="rpost" type="button" style="width:100%;margin-top:6px">Post checked legs as my ticket</button></div>
  ${joined ? '<details><summary class="lbl" style="cursor:pointer;margin:8px 0">Add legs</summary><div id="rlb"></div></details>' : ''}</div></div>`;

  const chat = V.querySelector('#chat');
  const bub = m => m.bot
    ? `<div class="bub" style="border-color:rgba(255,176,32,.45)"><small><span class="badge" style="color:var(--warn);border-color:var(--warn);padding:1px 5px">BOT</span> ${esc(m.bot)}${m.local ? ' · only you see this' : ' · ' + ago(m.created_at)}</small>${esc(m.body)}</div>`
    : `<div class="bub ${m.user_id === ME.id ? 'me' : ''}"><small><a href="#/u/${esc(names[m.user_id] || '')}" style="color:inherit">@${esc(names[m.user_id] || 'member')}</a> · ${ago(m.created_at)}</small>${esc(m.body)}</div>`;
  const { data: msgs } = await sb.from('messages').select('*').eq('room_id', id).order('created_at', {ascending: false}).limit(150);
  const list = (msgs || []).reverse();
  const shown = new Set(list.map(m => m.id)); let lastAt = list.length ? list[list.length - 1].created_at : '1970-01-01';
  chat.innerHTML = list.map(bub).join('') || '<p class="meta">No messages yet. Say something.</p>'; chat.scrollTop = chat.scrollHeight;
  const addMsg = async m => { if (m.id && shown.has(m.id)) return; if (m.id) shown.add(m.id); if (m.created_at > lastAt) lastAt = m.created_at; if (m.user_id && !names[m.user_id]) await loadMembers(); if (chat.querySelector('p.meta')) chat.innerHTML = ''; chat.insertAdjacentHTML('beforeend', bub(m)); chat.scrollTop = chat.scrollHeight; };
  const tour = async () => { for (const [b, t] of BOT_TOUR) { await new Promise(r => setTimeout(r, 1100)); if (!location.hash.startsWith('#/room/' + id)) return; addMsg({bot: b, body: t, local: true, created_at: new Date().toISOString()}); } };

  const j = V.querySelector('#join');
  if (j) j.onclick = async () => { const { error } = await sb.from('room_members').insert({room_id: id, user_id: ME.id}); if (error) return; if (room.pinned) { try { localStorage.setItem('bd_tour_' + id, '1'); } catch (e) {} sessionStorage.setItem('bd_tour_now', String(id)); } vRoom(id); };
  if (joined && room.pinned && sessionStorage.getItem('bd_tour_now') === String(id)) { sessionStorage.removeItem('bd_tour_now'); tour(); }
  const lv = V.querySelector('#leave'); if (lv) lv.onclick = async () => { await sb.from('room_members').delete().eq('room_id', id).eq('user_id', ME.id); vRoom(id); };
  const dr = V.querySelector('#delr'); if (dr) dr.onclick = async () => { if (!confirm('Delete this room for everyone?')) return; await sb.from('rooms').delete().eq('id', id); location.hash = '#/rooms'; };

  V.querySelector('#cf').onsubmit = async e => { e.preventDefault(); const i = V.querySelector('#ci'); const b = i.value.trim(); if (!b || !joined) return; i.value = ''; const { data, error } = await sb.from('messages').insert({room_id: id, user_id: ME.id, body: b}).select().single(); const cm = V.querySelector('#cm'); if (error) { cm.className = 'msg bad'; cm.textContent = error.message; i.value = b; } else { cm.textContent = ''; addMsg(data); } };

  let RL = [];
  const drawLegs = () => {
    V.querySelector('#rl').innerHTML = RL.map(l => `<li><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" data-id="${l.id}" ${l.in_ticket ? 'checked' : ''} ${joined ? '' : 'disabled'} style="width:auto;accent-color:#04ff9f"><span>${esc(l.leg)} <span class="meta">@${esc(names[l.user_id] || '')}</span></span></label><span>${l.pct ? `<b>${l.pct}%</b> ` : ''}${joined ? `<button class="btn sm bad" data-del="${l.id}" type="button" aria-label="Remove">x</button>` : ''}</span></li>`).join('') || '<li><span class="meta">No legs yet.</span></li>';
    const on = RL.filter(l => l.in_ticket);
    const hit = on.length && on.every(l => l.pct) ? Math.round(on.reduce((a, l) => a * l.pct / 100, 1) * 100) : null;
    V.querySelector('#rh').textContent = on.length ? `${on.length} legs checked${hit != null ? ` · model hit chance about ${hit}%` : ''}` : '';
  };
  const loadLegs = async () => { const { data } = await sb.from('room_legs').select('*').eq('room_id', id).order('created_at'); RL = data || []; drawLegs(); };
  await loadLegs();
  V.querySelector('#rl').onclick = async e => { const d = e.target.closest('[data-del]'); if (d) { await sb.from('room_legs').delete().eq('id', d.dataset.del); loadLegs(); } };
  V.querySelector('#rl').onchange = async e => { const c = e.target.closest('input[data-id]'); if (c) await sb.from('room_legs').update({in_ticket: c.checked}).eq('id', c.dataset.id); };
  if (joined) {
    const adding = [];
    legBuilder(V.querySelector('#rlb'), adding, async () => {
      V.querySelector('#rlb .cur').style.display = 'none';
      let added = false; while (adding.length) { const l = adding.shift(); await sb.from('room_legs').insert({room_id: id, user_id: ME.id, leg: l.text, pct: l.pct || null}); added = true; }
      if (added) loadLegs();
    });
  }
  V.querySelector('#rpost').onclick = () => { const on = RL.filter(l => l.in_ticket).map(l => ({text: l.leg, pct: l.pct || undefined})); if (on.length) { history.replaceState(null, '', '#/post'); setNav('post'); vPost(on); } };

  if (chan) sb.removeChannel(chan);
  chan = sb.channel('room-' + id, {config: {presence: {key: ME.id}}})
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + id}, ({ new: m }) => addMsg(m))
    .on('postgres_changes', {event: '*', schema: 'public', table: 'room_legs', filter: 'room_id=eq.' + id}, loadLegs)
    .on('presence', {event: 'sync'}, () => { const n = Object.keys(chan.presenceState()).length; const o = V.querySelector('#onl'); if (o) o.textContent = `● ${Math.max(1, n)} online`; })
    .subscribe(s => { if (s === 'SUBSCRIBED') chan.track({u: MYP.username}); });
  const roomHash = location.hash;
  const poll = setInterval(async () => {
    if (location.hash !== roomHash) return clearInterval(poll);
    const { data } = await sb.from('messages').select('*').eq('room_id', id).gt('created_at', lastAt).order('created_at');
    for (const m of data || []) await addMsg(m);
    loadLegs(); await loadMembers(); const mc = V.querySelector('#memc'); if (mc) mc.textContent = members.length + ' in the room';
  }, 6000);
}

const PING_K = {picks: "Ready for today's picks", update: 'Wants an update', recap: 'Wants the recap'};
let UNREAD = 0;
function setBadge(n) {
  UNREAD = Math.max(0, n);
  const a = document.querySelector('#nav a[data-r="inbox"]'); if (!a) return;
  a.innerHTML = 'Inbox' + (UNREAD ? ` <span style="background:var(--bad);color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;margin-left:2px">${UNREAD}</span>` : '');
  document.title = (UNREAD ? `(${UNREAD}) ` : '') + 'BettorDays App';
}
async function countUnread() {
  const [a, b] = await Promise.all([
    sb.from('pings').select('*', {count: 'exact', head: true}).eq('seen', false),
    sb.from('feedback').select('*', {count: 'exact', head: true}).eq('seen', false)
  ]);
  setBadge((a.count || 0) + (b.count || 0));
}
function toast(html, href) {
  const t = document.createElement('a'); t.href = href || '#/inbox';
  t.style.cssText = 'position:fixed;right:16px;top:70px;z-index:95;max-width:320px;background:#0f1311;border:1px solid var(--acc);box-shadow:0 0 30px rgba(4,255,159,.2);padding:12px 14px;color:var(--tx);text-decoration:none;font-size:14px;line-height:1.4';
  t.innerHTML = html; document.body.appendChild(t);
  t.animate([{opacity: 0, transform: 'translateY(-8px)'}, {opacity: 1, transform: 'none'}], {duration: 220});
  setTimeout(() => t.remove(), 6000);
}
function systemAlert(title, body) {
  try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(title, {body, tag: 'bd-inbox'}); } catch (e) {}
}
function watchInbox() {
  sb.channel('hq-inbox')
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'pings'}, async ({ new: p }) => {
      const { data } = await sb.from('profiles').select('username').eq('id', p.user_id).maybeSingle();
      const who = '@' + (data ? data.username : 'member');
      setBadge(UNREAD + 1); toast(`🛎️ <b>${esc(who)}</b> rang the bell<br><span class="meta">${esc(PING_K[p.kind])}${p.note ? ' · ' + esc(p.note) : ''}</span>`);
      systemAlert('🛎️ Order up', `${who}: ${PING_K[p.kind]}`);
      if (location.hash.startsWith('#/inbox')) vInbox();
    })
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'feedback'}, ({ new: f }) => {
      setBadge(UNREAD + 1); toast(`💬 <b>${esc(f.name)}</b> sent a message<br><span class="meta">${esc(f.msg.slice(0, 90))}</span>`);
      systemAlert('💬 New message', `${f.name}: ${f.msg.slice(0, 120)}`);
      if (location.hash.startsWith('#/inbox')) vInbox();
    })
    .subscribe();
  setInterval(countUnread, 60000);
}

async function vInbox(tab) {
  if (!MYS || !MYS.is_admin) { V.innerHTML = '<div class="empty">HQ staff only.</div>'; return; }
  tab = tab || (location.hash.split('/')[2]) || 'all';
  const [{ data: pings }, { data: fb }] = await Promise.all([
    sb.from('pings').select('*, profiles(username)').order('created_at', {ascending: false}).limit(200),
    sb.from('feedback').select('*, profiles(username)').order('created_at', {ascending: false}).limit(200)
  ]);
  const items = [
    ...(pings || []).map(p => ({t: 'ping', id: p.id, at: p.created_at, seen: p.seen, who: '@' + (p.profiles?.username || 'member'), head: '🛎️ ' + PING_K[p.kind], body: p.note})),
    ...(fb || []).map(f => ({t: 'fb', id: f.id, at: f.created_at, seen: f.seen, who: f.profiles ? '@' + f.profiles.username : f.name, head: '💬 ' + ({idea: 'Idea', pick: 'Pick request', feature: 'Feature request', other: 'Message'}[f.kind]), body: f.msg}))
  ].sort((a, b) => a.at < b.at ? 1 : -1);

  <div class="tabs">${[['all', 'All'], ['new', `New (${nNew})`], ['bell', `🛎️ Bell (${nBell})`], ['msgs', `💬 Messages (${nFb})`]].map(([k, l]) => `<a class="btn ${k === tab ? 'on' : ''}" href="#/inbox/${k}">${l}</a>`).join('')}<span class="sp"></span>${nNew ? '<button class="btn sm" id="allSeen" type="button">Mark all read</button>' : ''}${perm === 'default' ? '<button class="btn sm go" id="notif" type="button">Turn on pop-up alerts</button>' : ''}</div>
  ${show.map(i => `<div class="card" style="${i.seen ? 'opacity:.62' : 'border-color:var(--acc)'}"><div class="row"><b>${esc(i.head)}</b><span class="meta">${esc(i.who)} · ${ago(i.at)}</span><span class="sp"></span>${i.seen ? '<span class="meta">read</span>' : `<button class="btn sm seen" data-t="${i.t}" data-id="${i.id}" type="button">Mark read</button>`}</div>${i.body ? `<p style="margin:8px 0 0;white-space:pre-wrap;line-height:1.5">${esc(i.body)}</p>` : ''}</div>`).join('') || '<div class="empty">Nothing here.</div>'}`;
  V.querySelectorAll('.seen').forEach(b => b.onclick = async () => { await sb.from(b.dataset.t === 'ping' ? 'pings' : 'feedback').update({seen: true}).eq('id', b.dataset.id); vInbox(tab); });
  const all = V.querySelector('#allSeen'); if (all) all.onclick = async () => { await Promise.all([sb.from('pings').update({seen: true}).eq('seen', false), sb.from('feedback').update({seen: true}).eq('seen', false)]); vInbox(tab); };
  const nb = V.querySelector('#notif'); if (nb) nb.onclick = async () => { await Notification.requestPermission(); vInbox(tab); };
}

/* reactions: 🔥 and "I tailed" */
async function loadReactions(root) {
  const ids = [...root.querySelectorAll('article[data-id]')].map(a => +a.dataset.id); if (!ids.length) return;
  const { data } = await sb.from('reactions').select('pick_id, user_id, kind').in('pick_id', ids);
  const by = {}; (data || []).forEach(r => { const k = r.pick_id + r.kind; (by[k] = by[k] || []).push(r.user_id); });
  root.querySelectorAll('article[data-id]').forEach(a => {
    const id = a.dataset.id, box = a.querySelector('.rx'); if (!box) return;
    box.innerHTML = [['fire', '🔥'], ['tail', '🤝 Tailed']].map(([k, l]) => { const u = by[id + k] || []; const on = u.includes(ME.id); return `<button class="btn sm rxb ${on ? 'on' : ''}" data-k="${k}" data-on="${on ? 1 : ''}" type="button" aria-pressed="${on}">${l} ${u.length || ''}</button>`; }).join('') + `<button class="btn sm shr" type="button" aria-label="Share ticket">Share</button>`;
  });
  root.querySelectorAll('.rxb').forEach(b => b.onclick = async () => {
    const id = +b.closest('article').dataset.id;
    if (b.dataset.on) await sb.from('reactions').delete().eq('pick_id', id).eq('user_id', ME.id).eq('kind', b.dataset.k);
    else await sb.from('reactions').insert({pick_id: id, user_id: ME.id, kind: b.dataset.k});
    loadReactions(root);
  });
  root.querySelectorAll('.shr').forEach(b => b.onclick = async () => {
    const url = location.origin + '/app#/t/' + b.closest('article').dataset.id;
    try { if (navigator.share) { await navigator.share({title: 'BettorDays ticket', url}); return; } await navigator.clipboard.writeText(url); b.textContent = 'Link copied'; } catch (e) {}
  });
}

async function vTicket(id) {
  const { data } = await sb.from('picks').select(PSEL).eq('id', id).maybeSingle();
  V.innerHTML = `<div class="row" style="margin-bottom:10px"><a class="btn sm" href="#/feed">Back to feed</a></div>` + (data ? pickCard(data) : '<div class="empty">This ticket is private or was deleted.</div>');
  wirePicks(V); loadReactions(V);
}

async function vLeaders(win) {
  win = win || 30;
  const since = new Date(Date.now() - win * 86400000).toISOString();
  const { data } = await sb.from('picks').select('user_id, status, stake, payout, profiles(username, display_name)').in('status', ['won', 'lost', 'cashed_out']).gte('created_at', since).limit(2000);
  const T = {};
  (data || []).forEach(p => { const t = T[p.user_id] = T[p.user_id] || {u: p.profiles, w: 0, l: 0, net: 0, staked: 0}; const s = +p.stake || 0; t.staked += s; if (p.status === 'won') { t.w++; t.net += (+p.payout || 0) - s; } else if (p.status === 'lost') { t.l++; t.net -= s; } else { t.net += (+p.payout || 0) - s; } });
  const rows = Object.values(T).filter(t => t.w + t.l >= 1).sort((a, b) => b.net - a.net || (b.w - b.l) - (a.w - a.l));
  V.innerHTML = `<h1>The <span>leaderboard</span></h1><p class="sub">Ranked by profit on settled public tickets. Mark your tickets won or lost to get on the board.</p>
  <div class="tabs">${[[7, '7 days'], [30, '30 days'], [365, 'All time']].map(([d, l]) => `<button class="btn ${d === win ? 'on' : ''}" data-d="${d}" type="button">${l}</button>`).join('')}</div>
  ${rows.map((t, i) => `<a class="card row" href="#/u/${esc(t.u?.username)}" style="text-decoration:none;color:var(--tx);${i === 0 ? 'border-color:var(--acc)' : ''}"><b style="font:900 26px Kanit,sans-serif;width:42px;color:${i < 3 ? 'var(--acc)' : 'var(--mu)'}">${i === 0 ? '👑' : '#' + (i + 1)}</b><div><b>${esc(t.u?.display_name || t.u?.username)}</b> <span class="meta">@${esc(t.u?.username)}</span><div class="meta">${t.w}-${t.l} · ${t.w + t.l ? Math.round(100 * t.w / (t.w + t.l)) : 0}% · ROI ${t.staked ? Math.round(100 * t.net / t.staked) : 0}%</div></div><span class="sp"></span><b style="font:900 20px Kanit,sans-serif;color:${t.net >= 0 ? 'var(--acc)' : 'var(--bad)'}">${t.net >= 0 ? '+' : '-'}${money(Math.abs(t.net))}</b></a>`).join('') || '<div class="empty">No settled tickets yet. Post one, mark it won or lost, and take the crown.</div>'}`;
  V.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) vLeaders(+b.dataset.d); };
}

let STATS = null;
async function modelCard() {
  try { if (!STATS) { const r = await fetch('/stats.json', {cache: 'no-store'}); if (r.ok) STATS = await r.json(); } } catch (e) {}
  if (!STATS) return '';
  return `<a class="card" href="/" style="display:block;text-decoration:none;color:var(--tx);border-color:rgba(4,255,159,.45);background:linear-gradient(135deg,rgba(4,255,159,.08),rgba(17,21,19,.94))">
    <div class="row"><span class="lbl">The BettorDays model · live record</span><span class="sp"></span><span class="meta">Updated ${esc(STATS.last)}</span></div>
    <div class="nums" style="margin:10px 0 4px"><div><span class="lbl">70%+ legs</span><b style="color:var(--acc)">${STATS.h70}/${STATS.n70} · ${STATS.p70}%</b></div><div><span class="lbl">Legs graded</span><b>${STATS.n}</b></div><div><span class="lbl">Main tickets</span><b>${esc(STATS.mains)}</b></div><div><span class="lbl">3 random 70%+ legs</span><b>${STATS.three}%</b></div></div>
    <span class="meta">Tap for the full board, grades and receipts →</span></a>`;
}

function ringBell() {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(6,8,7,.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="bellT" style="max-width:400px;width:100%;border-color:var(--acc);text-align:center;padding:24px">
    <div style="font-size:54px;line-height:1" id="bellI">🛎️</div><h2 id="bellT" style="margin:10px 0 6px">Order up!</h2><p class="sub">Ring the bell and HQ gets your order. Like the bell at the counter, but for picks.</p>
    <div class="tabs" style="justify-content:center"><button class="btn on" data-k="picks" type="button">Today's picks</button><button class="btn" data-k="update" type="button">An update</button><button class="btn" data-k="recap" type="button">The recap</button></div>
    <input id="bellN" maxlength="200" placeholder="Anything to add? (optional)" style="margin-bottom:12px">
    <button class="btn go" id="bellGo" type="button" style="width:100%;padding:13px">Ring the bell</button><button class="btn" id="bellX" type="button" style="width:100%;margin-top:8px">Never mind</button><div class="msg" id="bellM"></div></div>`;
  document.body.appendChild(d);
  let kind = 'picks';
  d.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k; d.querySelectorAll('.tabs .btn').forEach(x => x.classList.toggle('on', x === b)); };
  const close = () => d.remove();
  d.querySelector('#bellX').onclick = close; d.onclick = e => { if (e.target === d) close(); };
  d.querySelector('#bellGo').onclick = async () => {
    const { data: { session } } = await sb.auth.getSession(); const M = d.querySelector('#bellM');
    const r = await fetch('/api/ping', {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token}, body: JSON.stringify({kind, note: d.querySelector('#bellN').value.trim()})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { M.className = 'msg bad'; M.textContent = j.error || 'Bell is stuck. Try again.'; return; }
    d.querySelector('#bellI').animate([{transform: 'rotate(0)'}, {transform: 'rotate(-20deg)'}, {transform: 'rotate(20deg)'}, {transform: 'rotate(0)'}], {duration: 450, iterations: 3});
    M.className = 'msg ok'; M.textContent = 'Ding ding! HQ got your order.'; setTimeout(close, 1800);
  };
}

async function vReset() {
  V.innerHTML = `<h1>New <span>password</span></h1><form class="card" id="rp"><label class="f lbl" for="np">New password</label><input id="np" type="password" minlength="8" autocomplete="new-password"><button class="btn go" type="submit" style="margin-top:12px">Save password</button><div class="msg" id="rm"></div></form>`;
  V.querySelector('#rp').onsubmit = async e => { e.preventDefault(); const p = V.querySelector('#np').value; const M = V.querySelector('#rm'); if (p.length < 8) { M.className = 'msg bad'; M.textContent = '8+ characters.'; return; } const { error } = await sb.auth.updateUser({password: p}); M.className = 'msg ' + (error ? 'bad' : 'ok'); M.textContent = error ? error.message : 'Password updated.'; };
}

function setNav(r) { document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r)); }
async function route() {
  if (chan && !location.hash.startsWith('#/room/')) { sb.removeChannel(chan); chan = null; }
  const h = location.hash.replace(/^#\/?/, '');
  const [a, b] = h.split('/');
  if (h.startsWith('reset') ) { setNav(''); return vReset(); }
  if (a === 'post') { setNav('post'); return vPost(); }
  if (a === 'people') { setNav('people'); return vPeople(); }
  if (a === 'me') { setNav('me'); return vMe(); }
  if (a === 'rooms') { setNav('rooms'); return vRooms(); }
  if (a === 'orders' || a === 'inbox') { setNav('inbox'); return vInbox(b); }
  if (a === 'leaders') { setNav('leaders'); return vLeaders(); }
  if (a === 't' && b) { setNav('feed'); return vTicket(+b); }
  if (a === 'room' && b) { setNav('rooms'); return vRoom(+b); }
  if (a === 'u' && b) { setNav(b === MYP.username ? 'me' : 'people'); return vUser(decodeURIComponent(b).toLowerCase()); }
  setNav('feed'); return vFeed();
}

sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { history.replaceState(null, '', '#/reset'); vReset(); } });
(async () => {
  if (/access_token|error_description/.test(location.hash)) await new Promise(r => setTimeout(r, 400));
  const recovering = /type=recovery/.test(location.hash);
  const ok = await loadMe();
  if (recovering) { history.replaceState(null, '', '#/reset'); }
  else if (/access_token/.test(location.hash)) history.replaceState(null, '', '#/feed?welcome');
  if (!ok || !MYP) { location.replace('/?join=1'); return; }
  await loadBoard();
  document.getElementById('bell').onclick = ringBell;
  if (MYS && MYS.is_admin) { const o = document.createElement('a'); o.href = '#/inbox'; o.dataset.r = 'inbox'; o.textContent = 'Inbox'; document.getElementById('nav').appendChild(o); countUnread(); watchInbox(); }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
